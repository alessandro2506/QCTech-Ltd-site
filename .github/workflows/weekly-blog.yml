name: Weekly Blog Post

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Get Anthropic token via OIDC
        id: anthropic-token
        run: |
          OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r '.value')
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> $GITHUB_OUTPUT

      - name: Generate blog post
        env:
          ANTHROPIC_OIDC_TOKEN: ${{ steps.anthropic-token.outputs.token }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push
        run: |
          git config user.name "QC Tech Blog Bot"
          git config user.email "hello@qc-tech.co.uk"
          git add content/blog/
          git diff --staged --quiet || git commit -m "feat(blog): auto-generated post $(date +%Y-%m-%d)"
          git push
