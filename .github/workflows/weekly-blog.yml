name: Weekly Blog Post

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate without writing markdown, CSV, or committing"
        type: boolean
        default: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.qctech_blog || secrets.ANTHROPIC_API_KEY }}
          BLOG_MAX_COST_USD: ${{ vars.BLOG_MAX_COST_USD || '0.50' }}
          BLOG_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Missing secret: set 'qctech_blog' or 'ANTHROPIC_API_KEY' in repo Settings > Secrets > Actions"
            exit 1
          fi
          node scripts/generate-blog-post.mjs

      - name: Commit and push
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: |
          git config user.name "QC Tech Blog Bot"
          git config user.email "hello@qc-tech.co.uk"
          git add content/blog/ data/blog-costs.csv
          git diff --staged --quiet || git commit -m "feat(blog): auto-generated post $(date +%Y-%m-%d)"
          git push
